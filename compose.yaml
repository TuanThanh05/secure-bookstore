name: secure-bookstore

services:
  db:
    image: mysql:8.4
    env_file:
      - database/.env.db
    environment:
      MYSQL_ROOT_HOST: "172.28.0.%"
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/config/my.cnf:/etc/mysql/conf.d/bookstore.cnf:ro
    networks:
      - bookstore_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  mysql_data:

networks:
  bookstore_net:
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1
