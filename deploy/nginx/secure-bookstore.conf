map $uri $bookstore_loggable {
    ~^/account/dat-lai-mat-khau/    0;
    ~^/account/dang-ky/xac-nhan/    0;
    default                         1;
}

# HTTP chỉ để chuyển sang HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name bookstore.local;                          # ĐỔI
    server_tokens off;
    access_log /var/log/nginx/access.log combined if=$bookstore_loggable;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bookstore.local;                          # ĐỔI
    server_tokens off;                                    # không lộ phiên bản Nginx
    access_log /var/log/nginx/access.log combined if=$bookstore_loggable;

    ssl_certificate     /etc/nginx/ssl/bookstore.crt;     # ĐỔI
    ssl_certificate_key /etc/nginx/ssl/bookstore.key;     # ĐỔI
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:bookstore_ssl:10m;
    ssl_session_tickets off;

    # Ảnh bìa tối đa 2 MB (catalog/covers.py); thêm chút cho phần còn lại của form.
    client_max_body_size 3m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # File tĩnh sau `python manage.py collectstatic --settings=bookstore.settings.prod`.
    location /static/ {
        alias /srv/secure-bookstore/staticfiles/;         # ĐỔI
        access_log off;
        add_header X-Content-Type-Options nosniff always;
    }

    location /media/covers/ {
        alias /srv/secure-bookstore/media/covers/;        # ĐỔI
        location ~* \.webp$ {
            default_type image/webp;
            add_header X-Content-Type-Options nosniff always;
            add_header Content-Security-Policy "default-src 'none'" always;
        }
        location ~ { return 404; }
    }
    location /media/ { return 404; }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;          # GHI ĐÈ bằng IP thật, client không giả được
        proxy_set_header X-Forwarded-For $remote_addr;    # cũng ghi đè, không nối thêm
        proxy_set_header X-Forwarded-Proto $scheme;       # cho SECURE_PROXY_SSL_HEADER của Django
        proxy_redirect off;
        proxy_read_timeout 30s;
    }
}
