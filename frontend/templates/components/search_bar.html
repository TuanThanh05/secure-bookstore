<form class="search-bar" method="get" action="{{ action }}" role="search">
  {% include "components/icon.html" with name="search" %}
  <label class="visually-hidden" for="search-q">Tìm sách</label>
  <input class="search-bar__input" id="search-q" type="search" name="q" value="{{ q }}"
         maxlength="100" placeholder="Tìm theo tên sách hoặc tác giả..." autocomplete="off">
  {% if category %}<input type="hidden" name="category" value="{{ category }}">{% endif %}
  <button class="btn" type="submit">
    Tìm sách {% include "components/icon.html" with name="arrow-forward" size="sm" %}
  </button>
</form>
