<nav class="category-filter" aria-label="Lọc theo thể loại">
  <a class="chip{% if not current %} chip--active{% endif %}"
     href="?{% if q %}q={{ q|urlencode }}{% endif %}"{% if not current %} aria-current="page"{% endif %}>Tất cả</a>
  {% for category in categories %}
    <a class="chip{% if category.id == current %} chip--active{% endif %}"
       href="?category={{ category.id }}{% if q %}&amp;q={{ q|urlencode }}{% endif %}"{% if category.id == current %} aria-current="page"{% endif %}>{{ category.name }}</a>
  {% endfor %}
</nav>
