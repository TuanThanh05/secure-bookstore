# Dependabot tự mở PR khi thư viện có bản vá (mục C, E: không dùng thư viện có lỗ hổng đã biết).
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
